name: Poll KGI QuoteCom and publish candidates

# 平日開盤前(台北時間 08:55,UTC 00:55)自動啟動一次,程式內部會跑到收盤前後
# 自動結束(見 Program.cs 的 5 小時 deadline)。也可以在 GitHub 網頁的
# Actions 分頁手動按「Run workflow」馬上測試,不用等排程時間到。
on:
  schedule:
    - cron: '55 0 * * 1-5'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: windows-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 編譯 QuoteWorker
        run: msbuild QuoteWorker\QuoteWorker.csproj /p:Configuration=Release /p:Platform=x64

      - name: 執行報價擷取(盤中持續執行,收盤前後自動結束)
        working-directory: QuoteWorker\bin\Release
        run: .\QuoteWorker.exe
        env:
          QUOTE_HOST: ${{ secrets.QUOTE_HOST }}
          QUOTE_PORT: ${{ secrets.QUOTE_PORT }}
          QUOTE_SOURCE_ID: ${{ secrets.QUOTE_SOURCE_ID }}
          QUOTE_TOKEN: ${{ secrets.QUOTE_TOKEN }}
          KGI_LOGIN_ID: ${{ secrets.KGI_LOGIN_ID }}
          KGI_LOGIN_PWD: ${{ secrets.KGI_LOGIN_PWD }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # QUOTE_SYMBOLS 先不設,程式會用內建的 5 檔測試名單(2330|2454|2317|2603|3037)。
          # 之後團隊決定好完整股票池,再到這裡加一行 QUOTE_SYMBOLS: ${{ secrets.QUOTE_SYMBOLS }}
